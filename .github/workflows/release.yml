name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发布的 tag（如 v0.3.0），留空则只构建不发布"
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: 解析版本号
        id: version
        run: |
          if [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-.+)?$ ]]; then
            name="${TAG#v}"
            code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
            echo "args=-PversionName=$name -PversionCode=$code" >> "$GITHUB_OUTPUT"
            echo "name=$name" >> "$GITHUB_OUTPUT"
            if [[ -n "${BASH_REMATCH[4]}" ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; fi
          elif [[ -n "$TAG" ]]; then
            echo "::error::tag 需形如 v1.2.3 或 v1.2.3-beta1，实际为 $TAG"; exit 1
          else
            echo "name=snapshot-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "BILICHAT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::未配置 KEYSTORE_BASE64，release APK 将使用 debug 签名"
          fi

      - name: 构建 APK
        env:
          BILICHAT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BILICHAT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BILICHAT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:assembleDebug ${{ steps.version.outputs.args }}

      - name: 整理产物
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/*.apk "dist/BiliChat-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/debug/*.apk "dist/BiliChat-${{ steps.version.outputs.name }}-debug.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: BiliChat-${{ steps.version.outputs.name }}
          path: dist/*

      - name: 发布 Release
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: BiliChat ${{ env.TAG }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: dist/*
